name: fuzz
on:
  # A new slot, Tuesday 12:23 UTC (Thursday is av1-rs's), next to the other crates' slots.
  schedule: [{ cron: '23 12 * * 2' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'Seconds per target (at most 3000; the job times out at 60 minutes, image build included)'
        default: '600'
      only:
        description: Run only this target (empty = all)
        default: ''
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.p.outputs.targets }}
      arm64: ${{ steps.p.outputs.arm64 }}
    steps:
      - id: p
        env:
          ONLY: ${{ inputs.only }}
          MAXT: ${{ inputs.max_total_time || '600' }}
        run: |
          case "$MAXT" in *[!0-9]*|'') echo "max_total_time must be a number" >&2; exit 1 ;; esac
          [ "$MAXT" -le 3000 ] || { echo "max_total_time over 3000 s would pass the job timeout" >&2; exit 1; }
          all="annexb hvcc params probe decode heic transform_tiers intra_tiers sao_tiers deblock_tiers"
          case "$ONLY" in
            '') list=$all ;;
            *) case " $all " in *" $ONLY "*) list=$ONLY ;; *) echo "unknown target $ONLY" >&2; exit 1 ;; esac ;;
          esac
          echo "targets=[$(echo $list | sed 's/[a-z_][a-z_]*/"&"/g; s/" "/","/g')]" >> "$GITHUB_OUTPUT"
          # The tier targets of the list also run on aarch64 (job fuzz-arm64).
          arm=$(for t in $list; do case $t in *_tiers) printf '%s ' $t ;; esac; done)
          echo "arm64=[$(echo $arm | sed 's/[a-z_][a-z_]*/"&"/g; s/" "/","/g')]" >> "$GITHUB_OUTPUT"
  fuzz:
    needs: plan
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Two fuzz jobs at a time, at most, so the fuzz run leaves hosted runners for CI.
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: hevc-fuzz:local
          cache-from: type=gha,scope=hevc-rs-fuzz
          cache-to: type=gha,mode=max,scope=hevc-rs-fuzz
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per target.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: tests/fuzz/seeds/<target> (made in the image build, in the format of that target)
      # and the fuzz-grown files; new inputs go to the first corpus dir.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} hevc-fuzz:local \
            sh -c 'mkdir -p tests/data/fuzz-grown && cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET tests/fuzz/seeds/$TARGET tests/data/fuzz-grown -- -max_total_time=$MAX_TOTAL_TIME -max_len=65536 -timeout=60 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.target }}
          path: corpus/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore

  # The NEON kernels: the four tier targets built and run natively on an arm64 runner (default
  # sanitizer), so every NEON tier is compared with scalar.
  # It starts after the x86_64 job, so there are never more than two fuzz jobs at a time.
  fuzz-arm64:
    needs: [plan, fuzz]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.arm64 != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # As above.
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.arm64) }}
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz-arm64
          load: true
          push: false
          tags: hevc-fuzz-arm64:local
          cache-from: type=gha,scope=hevc-rs-fuzz-arm64
          cache-to: type=gha,mode=max,scope=hevc-rs-fuzz-arm64
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      # The corpus is kept between runs, as in the job above.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-arm64-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-arm64-${{ matrix.target }}-
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} hevc-fuzz-arm64:local \
            sh -c 'mkdir -p tests/fuzz/corpus/$TARGET tests/fuzz/artifacts/$TARGET && tests/fuzz/target/aarch64-unknown-linux-gnu/release/$TARGET tests/fuzz/corpus/$TARGET -artifact_prefix=tests/fuzz/artifacts/$TARGET/ -max_total_time=$MAX_TOTAL_TIME -max_len=65536 -timeout=60 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}-arm64
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-arm64-${{ matrix.target }}-${{ github.run_id }}
