name: ci
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The checks run inside .github/ci/Dockerfile, built with docker buildx on GitHub-hosted runners:
  # ubuntu-24.04 for x86_64 and ubuntu-24.04-arm (native, no emulator) for the arm64 jobs. The crate
  # depends on dobbo-ca/isobmff-rs by git rev: every job that builds the image gets a GitHub App
  # token (while that repo is private), passed as the BuildKit secret gh_token.
  # The layers are saved to the Actions cache (one scope per job). Fork pull requests get no
  # secrets, so these jobs skip on them.
  # A PR needs `test` and avx512-sde (no Docker, every event); arm64, parity, parity-ref and
  # parity-arm64 run on main and on workflow_dispatch.
  test:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: ci
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=hevc-rs-test
          # Only main and dispatch runs export: a PR's cache is scoped to its ref, so no other PR
          # could read it, and the export takes about two minutes.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=hevc-rs-test' || '' }}
          secrets: |
            gh_token=${{ steps.app.outputs.token }}

  # The AVX-512 tier under Intel SDE, which emulates a Sapphire Rapids CPU (-spr): a hosted runner
  # can lack AVX-512 (the bench host did), and then `test` runs only scalar and AVX2. The unit
  # tests include the cross-tier tests (every tier in simd::available() against scalar);
  # HEVC_SIMD=avx512 makes them fail if the AVX-512 tier is not detected. SDE comes from Intel's
  # site, pinned by version and sha256. The build runs natively; only the test binaries run under
  # SDE. isobmff-rs is a public git dependency, so no token is needed.
  avx512-sde:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - name: Install Intel SDE
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
          # Pin (under SDE) attaches to the test process with ptrace.
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Unit tests under SDE (-spr, HEVC_SIMD=avx512)
        env:
          HEVC_SIMD: avx512
          HEVC_EXPECT_VNNI: '1'
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ runner.temp }}/sde/sde64 -spr --
        run: |
          cargo test --locked --release --lib
          cargo test --locked --release --lib -- --nocapture tier_is_detected_or_forced
      # Skylake-X: AVX-512 F, BW and VL without VNNI, so the Avx512 tier runs the AVX2 transform
      # residual kernel with the AVX-512 add_row (and the AVX-512 SAO kernels).
      - name: Unit tests under SDE (-skx, HEVC_SIMD=avx512, no VNNI)
        env:
          HEVC_SIMD: avx512
          HEVC_EXPECT_VNNI: '0'
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ runner.temp }}/sde/sde64 -skx --
        run: |
          cargo test --locked --release --lib
          cargo test --locked --release --lib -- --nocapture tier_is_detected_or_forced
      # A forced tier that the CPU lacks must fail: the same test on a Haswell (AVX2, no AVX-512).
      - name: HEVC_SIMD=avx512 fails without AVX-512 (-hsw)
        env:
          HEVC_SIMD: avx512
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ runner.temp }}/sde/sde64 -hsw --
        run: |
          log="$RUNNER_TEMP/hsw.log"
          cargo test --locked --release --lib -- --nocapture tier_is_detected_or_forced > "$log" 2>&1 \
            && { cat "$log"; echo "HEVC_SIMD=avx512 passed on a CPU without AVX-512"; exit 1; }
          cat "$log"
          # The failure must be the assert, not some other error.
          grep -q 'HEVC_SIMD=avx512, but' "$log"

  # The lib tests on a native aarch64 runner, both HEVC_SIMD tiers.
  arm64:
    if: github.event_name != 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=hevc-rs-arm64
          cache-to: type=gha,mode=max,scope=hevc-rs-arm64
          secrets: |
            gh_token=${{ steps.app.outputs.token }}

  # libde265 (dec265), ffmpeg and examples/oracle.rs decode the same inputs, and libheif and examples/heic.rs the HEIC
  # corpus; the output must be equal (tests/parity/run.sh). The stage never fails on a diff: the
  # report is the build output, and the last step fails on its status file.
  parity:
    if: github.event_name != 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-report
          build-args: CORPUS_RUN=${{ github.run_id }}-${{ github.run_attempt }}
          push: false
          outputs: type=local,dest=parity-out
          cache-from: type=gha,scope=hevc-rs-parity
          cache-to: type=gha,mode=max,scope=hevc-rs-parity
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      - if: always()
        run: '[ ! -f parity-out/summary.md ] || cat parity-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity
          path: parity-out
          if-no-files-found: ignore
      - run: exit "$(cat parity-out/status)"

  # The x86_64 reference tree of the oracle on the prefix streams (tests/parity/run.sh ref), for
  # parity-arm64.
  parity-ref:
    if: github.event_name != 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: x86-ref-out
          build-args: CORPUS_RUN=${{ github.run_id }}-${{ github.run_attempt }}
          push: false
          outputs: type=local,dest=parity-ref
          cache-from: type=gha,scope=hevc-rs-parity-ref
          cache-to: type=gha,mode=max,scope=hevc-rs-parity-ref
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      # A tar file: upload-artifact refuses file names with some characters (such as `:`).
      - run: tar -C parity-ref -cf parity-ref.tar .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-ref-x86
          path: parity-ref.tar
          retention-days: 1

  # The oracle built natively on an aarch64 runner, run on the parity-arm64 subset of the corpus
  # (tests/parity/run.sh, ARM_SET; both HEVC_SIMD tiers), compared with the x86_64 tree of
  # parity-ref.
  parity-arm64:
    if: github.event_name != 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: parity-ref
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-ref-x86
          path: ${{ runner.temp }}/x86ref-tar
      - run: mkdir -p "$RUNNER_TEMP/x86ref" && tar -C "$RUNNER_TEMP/x86ref" -xf "$RUNNER_TEMP/x86ref-tar/parity-ref.tar"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-arm64
          build-contexts: x86ref=${{ runner.temp }}/x86ref
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=hevc-rs-parity-arm64
          cache-to: type=gha,mode=max,scope=hevc-rs-parity-arm64
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
