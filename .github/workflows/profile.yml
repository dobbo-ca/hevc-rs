name: profile
on: { workflow_dispatch: {} }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Not a check: where hevc-rs and dec265 spend their time (tests/parity/profile.sh), in the job
  # summary, to choose what to optimize. perf needs a privileged container; callgrind is the
  # fallback when the host does not allow perf events.
  profile:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: profile
          load: true
          push: false
          tags: hevc-profile:local
          cache-from: type=gha,scope=hevc-rs-profile
          cache-to: type=gha,mode=max,scope=hevc-rs-profile
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      - run: docker run --rm --privileged hevc-profile:local sh tests/parity/profile.sh | tee -a "$GITHUB_STEP_SUMMARY"
