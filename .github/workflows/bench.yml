name: bench
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      require_avx512:
        description: Fail at once on a runner without AVX-512 (rerun to get one)
        type: boolean
        default: false
permissions:
  contents: read
# A new run waits for the one before it; it never cancels it (a measurement).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check, no gate. dec265 (libde265) and hevc-rs decode the same corpus in one
  # container, so the ratio compares the same machine.
  bench:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The CPU model and its AVX-512 subsets, in the job summary (hosted runners are Intel with
      # AVX-512 or AMD EPYC without it). With require_avx512 the job stops here on a host without
      # AVX-512 F, BW and VL, so a rerun can get one.
      - name: CPU
        env: { REQ: "${{ inputs.require_avx512 }}" }
        run: |
          model=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
          flags=$(grep -m1 '^flags' /proc/cpuinfo)
          sub=$(echo "$flags" | tr ' ' '\n' | grep '^avx512' | sort | tr '\n' ' ')
          echo "CPU: $model, $(nproc) CPUs. AVX-512: ${sub:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          ok=1
          for f in avx512f avx512bw avx512vl; do echo "$flags" | grep -qw $f || ok=0; done
          if [ "$REQ" = true ] && [ $ok = 0 ]; then echo "require_avx512: this host has no AVX-512" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench-report
          push: false
          outputs: type=local,dest=bench-out
          build-args: |
            BENCH_RUN=${{ github.run_id }}
            CORPUS_RUN=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=hevc-rs-bench
          cache-to: type=gha,mode=max,scope=hevc-rs-bench
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      - if: always()
        run: '[ ! -f bench-out/summary.md ] || cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: bench-out
          if-no-files-found: ignore
      - run: exit "$(cat bench-out/status)"
