# The public HEIC/HEIF (HEVC-coded) sets of the HEIC parity gate (docs/design.md, "Oracles and
# parity"; docs/parity.md). These are the HEVC sources of isobmff-rs's tests/parity/corpus.toml,
# at the same pinned commits. Nothing of it is committed to this repo. heic-fetch.sh makes one
# blobless sparse git checkout per [[source]] at the pinned `commit` (a SHA, checked after the
# fetch) into the BuildKit cache mount id=hevc-rs-heic-data, and puts hardlinks of the checked-out
# files, which are the files selected by `include` minus `exclude`, and only *.heic *.heif *.hif
# among them (any case), under <dir>/x/<name>/<path in the repo>. `lfs = true` sources also run
# `git lfs pull` for the included paths only.
#
# include / exclude: one line each, a TOML array of git sparse-checkout patterns (gitignore
# syntax). heic-fetch.sh anchors each at the repo root; * does not cross /, ** does.
#
# Not used, on purpose (as in isobmff-rs): nokiatech/heif master and heif_conformance (no usable
# licence), imazen testdata/features and testdata/synthetic (AGPL-3.0, undocumented), PhotoPrism,
# pillow_heif, Exiv2, libvips (no licence for the data).

# Not the libheif fuzzing corpora (fuzzing/data): libheif decodes hostile files that hevc-rs rejects on purpose, so G7 would flag them; hevc-rs has its own heic fuzz target.
[[source]]
name = "libheif"
repo = "https://github.com/strukturag/libheif"
commit = "12a259a5882dd99d45ec5fc77e296a3b620d1e2e"
include = ["tests/data/*.heic", "tests/data/*.heif", "tests/data/*.hif", "examples/*.heic", "examples/*.heif", "examples/*.hif"]
exclude = []
licence = "COPYING:1-2: \"The library libheif is distributed under the terms of the GNU Lesser General Public License. The sample applications and the Go and C++ wrappers are distributed under the terms of the MIT License.\" (no data-specific grant)"

[[source]]
name = "mpeg-ffc"
repo = "https://github.com/MPEGGroup/FileFormatConformance"
commit = "767a5bcb9fa4841d1b3bb0ca112a6e7d4c6bf067"
lfs = true
include = ["data/file_features/published/heif/*.heic", "data/file_features/under_consideration/cenc/*.heic"]
exclude = []
licence = "LICENSE:1-3: \"The Clear BSD License / Copyright (c) 2023, Apple Inc.\""

# Commit on the gh-pages branch of nokiatech/heif, not on its default branch. The conformance
# files that the MPEG repo does not have: C043..C053, C71 (a `mini` box, HEVC, orientation 8),
# MIAF*. The other `mini` box files there (C75.hmg, C83.hmg, 1dualMiniVVC.hmg) are VVC: no HEVC
# to compare, and libheif and isobmff-rs both reject them.
[[source]]
name = "nokia-conformance-extra"
repo = "https://github.com/nokiatech/heif"
commit = "f01283f3e64ccc6e6ab489bd556d454879069185"
include = ["content/conformance/C04[3-9].heic", "content/conformance/C05[0-3].heic", "content/conformance/C71.heic", "content/conformance/MIAF*.heic"]
exclude = []
licence = "CONTENT-LICENSES.md section 7: \"Freely redistributable for conformance testing and demonstration.\""

# The Apple HDR gain map sample and the libheif example lightning_mini.heif, which
# testdata/README.md licenses separately. lightning_mini.heif is the pre-final draft syntax of the
# `mini` box (its hvcC is read 2 bytes off): an error case on both sides. The final-syntax file of
# the same name is in the libheif source.
[[source]]
name = "imazen-heic"
repo = "https://github.com/imazen/heic"
commit = "4d72caddb4c1d664237a8d3693f35d69ac80caaf"
include = ["testdata/apple-hdr/*.heic", "testdata/libheif-examples/lightning_mini.heif"]
exclude = []
licence = "testdata/README.md, apple-hdr: \"Licensed under the MIT License\"; testdata/README.md:7-10, libheif-examples: \"Licensed under the MIT License (see libheif-examples/COPYING)\""

[[source]]
name = "aaron-rust-hdr"
repo = "https://github.com/aaron-rust/hdr-sample-images"
commit = "df0d5df406ad0dbe2124d6f2a3700fe73dd3ead7"
lfs = true
include = ["different_file_formats_in_sdr_and_hdr/3A*.heic", "different_file_formats_in_sdr_and_hdr/3B*.heic"]
exclude = []
licence = "README.md:31: \"All image files in this repository are licensed under the Creative Commons Zero (CC0) license\""
